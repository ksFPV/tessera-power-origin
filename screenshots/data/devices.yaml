# Showcase data for the simulator, not measured values.
tiles:
  - { tile: devices, name: Where to, sizes: [2x2], options: { home: sensor.preview_home, d1: sensor.preview_wallbox, d2: sensor.preview_heat_pump, d3: sensor.preview_rack, d4: sensor.preview_fridge, d5: sensor.preview_dishwasher, d6: sensor.preview_office, d7: sensor.preview_router } }
